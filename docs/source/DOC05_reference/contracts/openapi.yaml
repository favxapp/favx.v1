components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: cookie ilustrativo; o cookie efetivo é gerido Supabase SSR, não
        fixar nome
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - messageKey
          - requestId
          properties:
            code:
              type: string
            messageKey:
              type: string
            requestId:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
    PostInput:
      type: object
      required:
      - title
      - body
      properties:
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 10000
        visibleFrom:
          type:
          - string
          - 'null'
          format: date-time
        visibleUntil:
          type:
          - string
          - 'null'
          format: date-time
        timezone:
          type: string
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        linkIds:
          type: array
          items:
            type: string
            format: uuid
        expectedVersion:
          type: integer
          minimum: 1
    UploadIntent:
      type: object
      required:
      - kind
      - filename
      - bytes
      - mime
      - originKind
      properties:
        kind:
          type: string
          enum:
          - image
          - video
          - audio
        originKind:
          type: string
          enum:
          - native_capture
          - user_upload
        filename:
          type: string
        bytes:
          type: integer
          minimum: 1
        mime:
          type: string
        durationMs:
          type: integer
          minimum: 0
        sha256:
          type: string
    SearchSession:
      type: object
      required:
      - scopeKind
      - scopeOwnerId
      properties:
        scopeKind:
          type: string
          enum:
          - creator
          - saved
        scopeOwnerId:
          type: string
          format: uuid
        locale:
          type: string
          enum:
          - pt-BR
          - pt-PT
          - en
          - es
          - it
          - fr
    SearchMessage:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          maxLength: 2000
        locationText:
          type: string
        filters:
          type: object
    ContextInput:
      type: object
      properties:
        text:
          type: string
        audioAssetId:
          type: string
          format: uuid
        expectedGeneration:
          type: integer
    BannerInput:
      type: object
      properties:
        title:
          type: string
        mediaId:
          type: string
          format: uuid
        destinationUrl:
          type: string
          format: uri
        visibleFrom:
          type: string
          format: date-time
        visibleUntil:
          type: string
          format: date-time
        timezone:
          type: string
        expectedVersion:
          type: integer
    AnalyticsEvent:
      type: object
      required:
      - eventName
      - eventDedupeKey
      - sourceSurface
      - occurredAt
      properties:
        eventName:
          type: string
        eventDedupeKey:
          type: string
        sourceSurface:
          type: string
        occurredAt:
          type: string
          format: date-time
        postId:
          type: string
          format: uuid
        metadata:
          type: object
